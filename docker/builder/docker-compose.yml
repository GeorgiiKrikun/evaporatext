services:
  web-builder:
    image: evaporate-builder
    container_name: dioxus-builder
    user: "${UID}:${GID}"
    build:
      context: ../..
      dockerfile: ./docker/builder/Dockerfile
      args:
        UID: "${UID}"
    entrypoint: ["dx"]
    command: ["bundle", "--release", "--platform", "web"]
    volumes:
      - ../../build:/app/target/
    deploy:
      resources:
        limits:
          cpus: "0.9"

  wbdbg:
    image: evaporate-builder
    container_name: dioxus-builder
    tty: true
    user: "${UID}:${GID}"
    volumes:
      - ../../build/web:/app/target/dx/evaporate/release/web/public
